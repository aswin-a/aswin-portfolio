<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile nav, X-ray and Ask my work — in a phone viewport</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1550px; min-height: 1060px; box-sizing: border-box; padding: 64px; background: #EDE9E0; color: #1B1A17; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: grid; grid-template-columns: repeat(3, 390px); gap: 64px">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: #5C574E">{{f.num}} · SCROLL INSIDE THE PHONE</p>
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 30px">{{f.name}}</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: #5C574E">{{f.note}}</p>
</div>
<div style="width: 390px; height: 844px; border: 1px solid #D6D0C3; border-radius: 32px; overflow-y: auto; overflow-x: hidden; background: #F6F3EC">
<dc-import name="Mobile" start-menu="{{f.menu}}" start-xray="{{f.xray}}" intro-seen="{{f.seen}}" hint-size="390px,5400px"></dc-import>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1550,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      frames: [
        { num: '01', name: 'First visit', note: 'A 52px bar on top. X-ray and Ask my work live in a bottom bar within thumb reach, with a one-time X-ray hint above it.', menu: false, xray: false, seen: false },
        { num: '02', name: 'Menu open', note: 'Links as large rows, plus the X-ray switch with one line on what it shows.', menu: true, xray: false, seen: true },
        { num: '03', name: 'X-ray on', note: 'The bottom bar says “X-ray on”, so the state is always visible while scrolling.', menu: false, xray: true, seen: true }
      ]
    };
  }
}
</script>
</body>
</html>
