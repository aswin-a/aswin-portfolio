<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<sc-if value="{{wide}}" hint-placeholder-val="{{ true }}">
<header style="position: sticky; top: 0; z-index: 40; width: 100%; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: {{t.sans}}; border-bottom: 1px solid {{t.rule}}">
<nav aria-label="Main" style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap">
<a href="Main.dc.html" style="display: flex; align-items: baseline; gap: 10px; color: {{t.ink}}; text-decoration: none; min-height: 44px; align-items: center">
<span style="font-family: {{t.serif}}; font-size: 24px; letter-spacing: -0.01em">Aswin</span>
<span style="font-family: {{t.mono}}; font-size: 12px; color: {{t.muted}}">pm · builds for agents</span>
</a>
<div style="display: flex; align-items: center; gap: 4px 18px; flex-wrap: wrap">
<sc-for list="{{links}}" as="l" hint-placeholder-count="4">
<a href="{{l.href}}" onClick="{{l.click}}" aria-current="{{l.current}}" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; color: {{l.color}}; text-decoration: none; border-bottom: {{l.underline}}">{{l.label}}</a>
</sc-for>
<button type="button" onClick="{{toggle}}" aria-pressed="{{xray}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; border-radius: 999px; border: 1px solid {{toggleBorder}}; background: {{toggleBg}}; color: {{toggleInk}}; font-family: {{t.mono}}; font-size: 13px; cursor: pointer">
<span style="display: inline-block; width: 30px; height: 18px; border-radius: 999px; background: {{trackBg}}; position: relative"><span style="position: absolute; top: 2px; left: {{knobLeft}}; width: 14px; height: 14px; border-radius: 999px; background: {{knobBg}}"></span></span>
{{toggleLabel}}
<sc-if value="{{showNew}}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 6px; border-radius: 999px; background: {{t.accent}}; color: {{t.paper}}; font-size: 10px; letter-spacing: 0.06em">NEW</span></sc-if>
</button>
<button type="button" onClick="{{ask}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 14px; border-radius: 10px; border: 0; background: {{t.btnBg}}; color: {{t.btnInk}}; font-family: {{t.sans}}; font-size: 14px; font-weight: 600; cursor: pointer">Ask my work <span style="font-family: {{t.mono}}; font-size: 12px; font-weight: 400; opacity: 0.75">⌘K</span></button>
</div>
</nav>
</header>
</sc-if>
<sc-if value="{{narrow}}" hint-placeholder-val="{{ false }}">
<header style="position: sticky; top: 0; z-index: 40; background: {{t.bg}}; color: {{t.ink}}; font-family: {{t.sans}}; border-bottom: 1px solid {{t.rule}}">
<nav aria-label="Main" style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 8px 0 20px">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: {{t.ink}}; text-decoration: none"><span style="font-family: {{t.serif}}; font-size: 21px; letter-spacing: -0.01em">Aswin</span><span style="font-family: {{t.mono}}; font-size: 11px; color: {{t.muted}}">pm · builds for agents</span></a>
<button type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-controls="nav-menu" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 0 12px; border: 0; background: transparent; color: {{t.ink}}; font-family: {{t.mono}}; font-size: 13px; cursor: pointer">{{menuLabel}}<span aria-hidden="true" style="font-size: 16px">{{menuIcon}}</span></button>
</nav>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div id="nav-menu" style="position: absolute; left: 0; right: 0; top: 52px; z-index: 2; background: {{t.bg}}; border-bottom: 1px solid {{t.rule}}; box-shadow: 0 16px 32px rgba(27, 26, 23, 0.12); padding: 4px 20px 20px; display: flex; flex-direction: column">
<sc-for list="{{links}}" as="ml" hint-placeholder-count="5">
<a href="{{ml.href}}" onClick="{{ml.click}}" aria-current="{{ml.current}}" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid {{t.rule}}; font-size: 18px; color: {{t.ink}}; text-decoration: none">{{ml.label}}<span aria-hidden="true" style="font-family: {{t.mono}}; font-size: 13px; color: {{ml.markInk}}">{{ml.mark}}</span></a>
</sc-for>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 16px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">X-ray</span>
<span style="font-size: 13px; line-height: 1.45; color: {{t.muted}}">Shows how the AI works: sources, guardrails, cost.</span>
</div>
<button type="button" onClick="{{toggle}}" role="switch" aria-checked="{{xray}}" aria-label="X-ray" style="flex: none; width: 52px; height: 32px; padding: 0; border-radius: 999px; border: 0; background: {{switchBg}}; position: relative; cursor: pointer"><span style="position: absolute; top: 3px; left: {{switchKnob}}; width: 26px; height: 26px; border-radius: 999px; background: {{t.paper}}"></span></button>
</div>
</div>
<div aria-hidden="true" onClick="{{toggleMenu}}" style="position: fixed; left: 0; right: 0; top: 52px; bottom: 0; z-index: 1; background: rgba(27, 26, 23, 0.4)"></div>
</sc-if>
</header>
<sc-if value="{{showDock}}" hint-placeholder-val="{{ true }}">
<div style="position: fixed; left: 0; right: 0; bottom: 16px; z-index: 39; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 16px; pointer-events: none; font-family: {{t.sans}}">
<sc-if value="{{showNew}}" hint-placeholder-val="{{ false }}">
<div role="status" style="pointer-events: auto; position: relative; display: flex; align-items: center; gap: 12px; max-width: 340px; padding: 10px 12px 10px 14px; border-radius: 12px; background: {{t.paper}}; border: 1px solid {{t.accent}}; box-shadow: 0 8px 24px rgba(27, 26, 23, 0.14); color: {{t.ink}}">
<span style="font-size: 14px; line-height: 1.4"><b style="font-weight: 600">New: X-ray.</b> Turn it on to see how the AI works here.</span>
<button type="button" onClick="{{dismissNew}}" style="flex: none; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid {{t.accent}}; background: transparent; color: {{t.accent}}; font-family: {{t.sans}}; font-size: 13px; cursor: pointer">Got it</button>
</div>
</sc-if>
<div style="pointer-events: auto; display: flex; align-items: stretch; width: 100%; max-width: 340px; height: 52px; border-radius: 999px; background: #101214; box-shadow: 0 10px 28px rgba(16, 18, 20, 0.28); overflow: hidden">
<button type="button" onClick="{{toggle}}" aria-pressed="{{xray}}" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 0 18px; border: 0; background: transparent; color: #E9E6DF; font-family: {{t.mono}}; font-size: 13px; cursor: pointer"><span aria-hidden="true" style="width: 26px; height: 16px; border-radius: 999px; background: {{dockTrack}}; position: relative"><span style="position: absolute; top: 2px; left: {{dockKnob}}; width: 12px; height: 12px; border-radius: 999px; background: {{dockKnobBg}}"></span></span>{{dockXLabel}}</button>
<span aria-hidden="true" style="width: 1px; margin: 12px 0; background: #3A4047"></span>
<button type="button" onClick="{{ask}}" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: transparent; color: #FFFDF8; font-family: {{t.sans}}; font-size: 15px; font-weight: 600; cursor: pointer">Ask my work <span aria-hidden="true" style="font-family: {{t.mono}}; font-size: 13px; font-weight: 400; color: #A3A9B0">↑</span></button>
</div>
</div>
</sc-if>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["home","work","stack","log","about"],"default":"home"},"compact":{"editor":"boolean","default":false},"askOpen":{"editor":"boolean","default":false},"xray":{"editor":"boolean","default":false},"isNew":{"editor":"boolean","default":false},"onToggleXray":{"editor":null},"onAsk":{"editor":null},"$preview":{"width":1280,"height":96}}'>
var NAV_FONTS = { serif: "'Newsreader', Georgia, serif", sans: "'IBM Plex Sans', system-ui, sans-serif", mono: "'IBM Plex Mono', ui-monospace, Menlo, monospace" };
function navTokens(x) {
  var c = x
    ? { bg: '#101214', paper: '#171A1D', ink: '#E9E6DF', muted: '#A3A9B0', rule: '#2B3036', accent: '#8DBBF2', btnBg: '#E9E6DF', btnInk: '#101214' }
    : { bg: '#F6F3EC', paper: '#FFFDF8', ink: '#1B1A17', muted: '#5C574E', rule: '#E2DCD0', accent: '#1F4C86', btnBg: '#1B1A17', btnInk: '#FFFDF8' };
  c.serif = NAV_FONTS.serif; c.sans = NAV_FONTS.sans; c.mono = NAV_FONTS.mono;
  return c;
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { localX: false, menuOpen: false, newSeen: false, narrow: !!props.compact || (typeof window !== 'undefined' && window.innerWidth < 640) };
    this.onResize = () => { var n = !!this.props.compact || window.innerWidth < 640; if (n !== this.state.narrow) this.setState({ narrow: n, menuOpen: false }); };
  }
  componentDidMount() { if (typeof window !== 'undefined') window.addEventListener('resize', this.onResize); }
  componentWillUnmount() { if (typeof window !== 'undefined') window.removeEventListener('resize', this.onResize); }
  renderVals() {
    var controlled = typeof this.props.onToggleXray === 'function';
    var x = controlled ? !!this.props.xray : (this.state.localX || !!this.props.xray);
    var t = navTokens(false);
    var cur = this.props.current || 'home';
    var items = [
      { id: 'work', label: 'Case studies', href: 'WorkIndex.dc.html' },
      { id: 'stack', label: 'Stack', href: 'Stack.dc.html' },
      { id: 'log', label: 'Build log', href: 'BuildLog.dc.html' },
      { id: 'about', label: 'CV', href: 'About.dc.html' },
      { id: 'contact', label: 'Contact', href: '#contact' }
    ];
    return {
      t: t, xray: x,
      wide: !this.state.narrow, narrow: !!this.state.narrow,
      showNew: !!this.props.isNew && !x && !this.state.newSeen,
      dismissNew: () => this.setState({ newSeen: true }),
      menuOpen: this.state.menuOpen, menuLabel: this.state.menuOpen ? 'Close' : 'Menu', menuIcon: this.state.menuOpen ? '✕' : '☰',
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      showDock: !this.state.menuOpen && !this.props.askOpen,
      switchBg: x ? t.accent : t.rule, switchKnob: x ? '23px' : '3px',
      dockTrack: x ? '#8DBBF2' : '#3A4047', dockKnob: x ? '12px' : '2px', dockKnobBg: x ? '#101214' : '#A3A9B0',
      dockXLabel: x ? 'X-ray on' : 'X-ray',
      links: items.map((l) => ({
        label: l.label, href: l.href,
        mark: l.id === cur ? '•' : (l.id === 'contact' ? '↓' : '→'), markInk: l.id === cur ? t.ink : t.muted,
        click: (e) => {
          if (this.state.menuOpen) this.setState({ menuOpen: false });
          if (l.id !== 'contact' || typeof document === 'undefined') return;
          var el = document.getElementById('contact');
          if (!el) return;
          if (e && e.preventDefault) e.preventDefault();
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        },
        current: l.id === cur ? 'page' : undefined,
        color: l.id === cur ? t.ink : t.muted,
        underline: l.id === cur ? '2px solid ' + t.ink : '2px solid transparent'
      })),
      trackBg: x ? '#8DBBF2' : t.rule,
      toggleBg: x ? '#101214' : t.paper, toggleInk: x ? '#E9E6DF' : t.ink, toggleBorder: x ? '#101214' : t.rule,
      toggleLabel: 'X-ray',
      knobBg: x ? t.bg : t.paper,
      knobLeft: x ? '14px' : '2px',
      toggle: () => { if (controlled) this.props.onToggleXray(); else this.setState({ localX: !this.state.localX }); },
      ask: () => { if (this.state.menuOpen) this.setState({ menuOpen: false }); if (this.props.onAsk) this.props.onAsk(); }
    };
  }
}
</script>
</body>
</html>
