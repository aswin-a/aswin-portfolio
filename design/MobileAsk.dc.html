<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask my work — phone bottom sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #4F7FC0;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F3EC; color: #1B1A17; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<header style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 8px 0 20px; border-bottom: 1px solid #E2DCD0"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 21px">Aswin</span><span style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px">Menu <span aria-hidden="true" style="font-size: 16px">☰</span></span></header>
<dc-import name="Hero" initial="empty" compact="{{ true }}" hint-size="390px,900px"></dc-import>
<dc-import name="Ask" open="{{open}}" sheet="{{ true }}" contained="{{ true }}" page="home" on-close="{{close}}" hint-size="390px,844px"></dc-import>
<sc-if value="{{closed}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{reopen}}" style="position: absolute; left: 20px; right: 20px; bottom: 20px; min-height: 52px; border-radius: 12px; border: 0; background: #1B1A17; color: #FFFDF8; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Ask my work</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: true }; }
  renderVals() {
    return {
      open: this.state.open, closed: !this.state.open,
      close: () => this.setState({ open: false }),
      reopen: () => this.setState({ open: true })
    };
  }
}
</script>
</body>
</html>
